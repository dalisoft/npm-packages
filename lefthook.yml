pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: '*.{js,jsx,ts,tsx,json,jsonc,css,html}'
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: rumdl
      glob: '*.md'
      run: bunx rumdl fmt {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}
